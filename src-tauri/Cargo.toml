[package]
name = "re-cbt"
version = "0.1.0"
edition = "2021"
description = "Klien ujian CBT aman dan cepat (Rust + Tauri) - perbaikan lanjutan dari temuan teardown-CBT"
license = "MIT"
repository = "https://github.com/aditiya-saputra/RE-CBT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# TLS hanya rustls (webpki roots) - tidak ada native-tls/NODE_TLS_REJECT_UNAUTHORIZED
# (perbaiki Temuan #4 di teardown-CBT)
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-webpki-roots",
  "json",
  "http2",
] }
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
thiserror = "2"

[profile.release]
strip = true
codegen-units = 1
lto = "thin"
